<!DOCTYPE html>
<html>
<head>
    <title>Flower Gallery</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        #mainImage {
            width: 400px;
            height: 250px;
        }

        .flower {
            width: 100px;
            height: 70px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>My Gallery</h1>

    
    <img id="mainImage"
         src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=600&q=80">

    <br><br>


    <img class="flower"
         src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=600&q=80"
         onclick="changeImage(this)">

    
    <img class="flower"
         src="https://images.unsplash.com/photo-1520763185298-1b434c919102?auto=format&fit=crop&w=600&q=80"
         onclick="changeImage(this)">


    <img class="flower"
         src="https://images.unsplash.com/photo-1591871937573-74dbba515c4c?auto=format&fit=crop&w=600&q=80"
         onclick="changeImage(this)">

    <script>

        function changeImage(image) {
            document.getElementById("mainImage").src = image.src;
        }

    </script>

</body>
</html>
